[project]
name = "fast-langdetect"
version = "1.0.1"
description = "Quickly detect text language and segment language"
authors = [
    { name = "sudoskys", email = "coldlando@hotmail.com" },
]
dependencies = [
    "robust-downloader>=0.0.2",
    "fasttext-predict>=0.9.2.4; python_version < '3.14'",
    # fasttext-predict has no 3.14 wheels and its repository is gone (#34).
    # Exact pin: this fork has a single maintainer, so review each release before bumping.
    "fasttext-predict-v2==1.1.0; python_version >= '3.14'",
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=7.4.4",
]
